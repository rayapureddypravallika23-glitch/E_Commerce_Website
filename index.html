<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Website</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      background:#ffe6f2;
      color:#333;
    }

    header{
      background:#ff1493;
      color:white;
      padding:15px;
      text-align:center;
      font-size:28px;
      font-weight:bold;
    }

    nav{
      background:#ff69b4;
      padding:10px;
      text-align:center;
    }

    nav a{
      color:white;
      text-decoration:none;
      margin:0 15px;
      font-weight:bold;
    }

    .hero{
      text-align:center;
      padding:50px 20px;
      background:linear-gradient(to right,#ff69b4,#ff1493);
      color:white;
    }

    .hero h1{
      font-size:45px;
      margin-bottom:15px;
    }

    .hero p{
      font-size:20px;
    }

    .products{
      padding:50px 10%;
    }

    .products h2{
      text-align:center;
      margin-bottom:30px;
      font-size:35px;
      color:#ff1493;
    }

    .product-container{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .product-card{
      background:white;
      width:250px;
      padding:20px;
      border-radius:10px;
      text-align:center;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    .product-card img{
      width:100%;
      height:200px;
      object-fit:cover;
      border-radius:10px;
    }

    .product-card h3{
      margin:15px 0;
    }

    .price{
      color:#ff1493;
      font-size:22px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .product-card button{
      padding:10px 20px;
      background:#ff1493;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
    }

    .cart{
      text-align:center;
      padding:40px;
      background:white;
      margin:30px auto;
      width:80%;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    .cart h2{
      color:#ff1493;
      margin-bottom:20px;
    }

    footer{
      background:#ff1493;
      color:white;
      text-align:center;
      padding:15px;
      margin-top:30px;
    }

    @media(max-width:768px){

      .hero h1{
        font-size:30px;
      }

      .product-container{
        flex-direction:column;
        align-items:center;
      }

    }

  </style>
</head>

<body>

  <header>
    Pravallika Store
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#products">Products</a>
    <a href="#cart">Cart</a>
    <a href="#contact">Contact</a>
  </nav>

  <section class="hero">
    <h1>Welcome To My E-Commerce Website</h1>
    <p>Shop Your Favourite Products Online</p>
  </section>

  <section class="products" id="products">

    <h2>Featured Products</h2>

    <div class="product-container">

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=800&auto=format&fit=crop" alt="T-Shirt">
        <h3>Pink T-Shirt</h3>
        <p class="price">₹499</p>
        <button onclick="addToCart()">Add To Cart</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=800&auto=format&fit=crop" alt="Shoes">
        <h3>Stylish Shoes</h3>
        <p class="price">₹999</p>
        <button onclick="addToCart()">Add To Cart</button>
      </div>

      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=800&auto=format&fit=crop" alt="Watch">
        <h3>Smart Watch</h3>
        <p class="price">₹1499</p>
        <button onclick="addToCart()">Add To Cart</button>
      </div>

    </div>

  </section>

  <section class="cart" id="cart">

    <h2>Shopping Cart</h2>

    <p>Total Items: <span id="count">0</span></p>

  </section>

  <footer id="contact">
    <p>© 2026 Pravallika Store | All Rights Reserved</p>
  </footer>

  <script>

    let count = 0;

    function addToCart(){

      count++;

      document.getElementById("count").innerText = count;

      alert("Product Added To Cart Successfully!");

    }

  </script>

</body>
</html>
